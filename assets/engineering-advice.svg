<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="245" viewBox="0 0 1000 245" role="img" aria-labelledby="title desc">
  <title id="title">Engineering advice from Moaz Mohammed</title>
  <desc id="desc">Do not just use the abstraction. Open it, test it, break it, and learn why it works. The best shortcut is understanding the long way first.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#24235f"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="245" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="998" height="243" rx="27" fill="none" stroke="#6366f1" stroke-opacity="0.65"/>
  <text x="63" y="82" fill="#818cf8" opacity="0.75" font-family="Georgia,serif" font-size="78">“</text>
  <circle cx="916" cy="54" r="7" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>

  <text x="500" y="87" text-anchor="middle" fill="#eef2ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="650">Do not just use the abstraction.</text>
  <text x="500" y="121" text-anchor="middle" fill="#eef2ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="650">Open it, test it, break it, and learn why it works.</text>
  <text x="500" y="165" text-anchor="middle" fill="#a5b4fc" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="550">The best shortcut is understanding the long way first.</text>

  <rect x="250" y="195" width="500" height="3" rx="2" fill="#30365f"/>
  <rect x="250" y="195" width="105" height="3" rx="2" fill="url(#accent)"><animate attributeName="x" values="250;645;250" dur="5s" repeatCount="indefinite"/></rect>
  <text x="500" y="225" text-anchor="middle" fill="#22d3ee" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2">MOAZ MOHAMMED · LEARNING PRINCIPLE</text>
</svg>
